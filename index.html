<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Search Bar</title>

    <style id="component-styles">
        :root {
            --bg-color: #0f172a;
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text-color: #e2e8f0;
            --accent-color: #38bdf8;
            --accent-glow: rgba(56, 189, 248, 0.3);
            --placeholder-color: #64748b;
        }

        .search-wrapper {
            position: relative;
            width: 100%;
            max-width: 480px;
            height: 64px;
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 32px;
            display: flex;
            align-items: center;
            padding: 0 1.5rem;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            transform-origin: center;
            box-shadow: 0 4px 24px -2px rgba(0, 0, 0, 0.1);
        }

        .search-wrapper:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.2);
            transform: translateY(-1px);
            box-shadow: 0 8px 32px -4px rgba(0, 0, 0, 0.2);
        }

        .search-wrapper:focus-within {
            width: 100%;
            max-width: 520px;
            background: rgba(255, 255, 255, 0.08);
            border-color: var(--accent-color);
            box-shadow: 0 0 0 4px var(--accent-glow), 0 8px 40px -4px rgba(0, 0, 0, 0.3);
            transform: translateY(-2px);
        }

        .search-icon {
            width: 24px;
            height: 24px;
            color: var(--placeholder-color);
            transition: color 0.3s ease;
            flex-shrink: 0;
        }

        .search-wrapper:focus-within .search-icon {
            color: var(--accent-color);
        }

        .search-input {
            width: 100%;
            height: 100%;
            background: transparent;
            border: none;
            outline: none;
            color: var(--text-color);
            font-size: 1.125rem;
            margin-left: 1rem;
            font-weight: 400;
        }

        .search-input::placeholder {
            color: var(--placeholder-color);
            transition: opacity 0.3s ease;
        }

        .search-wrapper:focus-within .search-input::placeholder {
            opacity: 0.7;
        }
    </style>

    <style id="demo-styles">
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            color: var(--text-color);
            overflow: hidden;
        }

        .search-container {
            position: relative;
            width: 100%;
            max-width: 600px;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2rem;
        }

        .get-code-btn {
            background: transparent;
            border: 1px solid var(--glass-border);
            color: var(--text-color);
            padding: 0.75rem 1.5rem;
            border-radius: 999px;
            font-size: 0.875rem;
            cursor: pointer;
            transition: all 0.3s ease;
            opacity: 0.6;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .get-code-btn:hover {
            opacity: 1;
            background: var(--glass-bg);
            border-color: rgba(255, 255, 255, 0.3);
            transform: translateY(-1px);
        }

        .get-code-btn svg {
            width: 16px;
            height: 16px;
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(8px);
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            padding: 2rem;
        }

        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .modal-content {
            background: #1e293b;
            width: 100%;
            max-width: 800px;
            max-height: 70vh;
            border-radius: 20px;
            border: 1px solid var(--glass-border);
            box-shadow: 0 40px 80px -12px rgba(0, 0, 0, 0.6);
            display: flex;
            flex-direction: column;
            transform: scale(0.95);
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            overflow: visible;
            position: relative;
        }

        .modal-overlay.active .modal-content {
            transform: scale(1);
        }

        .code-area {
            padding: 0;
            overflow: auto;
            background: #0f172a;
            color: #e2e8f0;
            font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace;
            font-size: 0.9rem;
            line-height: 1.6;
            flex: 1;
            border-radius: 20px;
            box-shadow: inset 0 0 40px rgba(0, 0, 0, 0.2);
        }

        .code-area pre {
            padding: 2.5rem;
            margin: 0;
        }

        .modal-actions-float {
            position: absolute;
            top: 1.5rem;
            right: 1.5rem;
            display: flex;
            gap: 0.75rem;
            z-index: 10;
        }

        .modal-btn {
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(4px);
            border: 1px solid var(--glass-border);
            color: var(--text-color);
            width: 36px;
            height: 36px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .modal-btn:hover {
            background: var(--glass-bg);
            border-color: rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
        }

        .modal-btn svg {
            width: 18px;
            height: 18px;
            stroke-width: 2;
        }

        .modal-btn.copy:active {
            transform: scale(0.95);
        }

        .modal-btn.close:hover {
            background: rgba(239, 68, 68, 0.2);
            border-color: rgba(239, 68, 68, 0.3);
            color: #fca5a5;
        }

        .copy-tooltip {
            position: absolute;
            top: -40px;
            right: 0;
            background: #22c55e;
            color: white;
            padding: 0.4rem 0.8rem;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 500;
            opacity: 0;
            transform: translateY(10px);
            transition: all 0.2s ease;
            pointer-events: none;
            white-space: nowrap;
        }

        .modal-btn.copy.copied .copy-tooltip {
            opacity: 1;
            transform: translateY(0);
        }

        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.2);
        }
    </style>
</head>

<body>

    <div class="search-container">
        <div class="search-wrapper">
            <svg class="search-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"
                xmlns="http://www.w3.org/2000/svg">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
            </svg>
            <input type="text" class="search-input" placeholder="Search...">
        </div>

        <button class="get-code-btn" id="getCodeBtn">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4"></path>
            </svg>
            Get Code
        </button>
    </div>

    <div class="modal-overlay" id="codeModal">
        <div class="modal-content">
            <div class="modal-actions-float">
                <button class="modal-btn copy" id="copyBtn" aria-label="Copy Code">
                    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z">
                        </path>
                    </svg>
                    <span class="copy-tooltip">Copied!</span>
                </button>
                <button class="modal-btn close" id="closeBtn" aria-label="Close Modal">
                    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12">
                        </path>
                    </svg>
                </button>
            </div>
            <div class="code-area">
                <pre><code id="sourceCode"></code></pre>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const getCodeBtn = document.getElementById('getCodeBtn');
            const modal = document.getElementById('codeModal');
            const closeBtn = document.getElementById('closeBtn');
            const copyBtn = document.getElementById('copyBtn');
            const sourceCodeBlock = document.getElementById('sourceCode');

            const extractComponentCode = () => {
                const componentStyles = document.getElementById('component-styles').textContent;
                const componentHTML = document.querySelector('.search-wrapper').outerHTML;

                return `<style>\n${componentStyles}\n</style>\n\n${componentHTML}`;
            };

            const componentCode = extractComponentCode();
            sourceCodeBlock.textContent = componentCode;

            getCodeBtn.addEventListener('click', () => {
                modal.classList.add('active');
            });

            const closeModal = () => {
                modal.classList.remove('active');
            };

            closeBtn.addEventListener('click', closeModal);

            modal.addEventListener('click', (e) => {
                if (e.target === modal) {
                    closeModal();
                }
            });

            copyBtn.addEventListener('click', () => {
                navigator.clipboard.writeText(componentCode).then(() => {
                    copyBtn.classList.add('copied');
                    setTimeout(() => {
                        copyBtn.classList.remove('copied');
                    }, 2000);
                }).catch(err => {
                    console.error('Failed to copy: ', err);
                });
            });

            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape' && modal.classList.contains('active')) {
                    closeModal();
                }
            });
        });
    </script>
</body>

</html>
